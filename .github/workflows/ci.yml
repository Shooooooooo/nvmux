name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail rather than skip the integration tests when nvim is missing. Not
  # `ssh`: runners have no host to connect to.
  NVMUX_TEST_REQUIRE: nvim

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test-threads: 32
          - os: macos-latest
            test-threads: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Saved from main only, so branches don't evict main's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Neovim (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o nvim.tar.gz \
            https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf nvim.tar.gz
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim
      - run: nvim --version | head -1
      # The remote command is tested under each login shell found; fish and
      # tcsh are not POSIX. macOS ships tcsh and zsh.
      - name: Install login shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish tcsh zsh
      # rustfmt is platform-independent; clippy is not (see waitid in
      # src/pty.rs).
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      # Integration tests mostly wait (on Neovim, slowed links, frames), so
      # they run 32 at a time on Linux. macOS runs 12: at 32 it ran out of
      # ptys (ENXIO). 32 at once need more than macOS's default 256 open
      # files (EMFILE), hence the raised ulimit.
      - name: cargo test
        run: |
          if [ "$(ulimit -n)" != unlimited ] && [ "$(ulimit -n)" -lt 4096 ]; then
            ulimit -n 4096
          fi
          ulimit -n
          cargo test --lib --bins
          RUST_TEST_THREADS=${{ matrix.test-threads }} cargo test --test '*'
          cargo test --doc

  msrv:
    name: rust-version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets
