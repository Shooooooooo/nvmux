name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The integration tests skip when there is no usable nvim. In CI that would
  # be a silent no-op, so a missing nvim is a failure here. `ssh` is not
  # listed: the SSH tests need a host that answers, which a runner has not.
  NVMUX_TEST_REQUIRE: nvim

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Neovim (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o nvim.tar.gz \
            https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf nvim.tar.gz
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim
      - run: nvim --version | head -1
      # rustfmt's output does not vary by platform; clippy's findings do
      # (see the cfg-divergent waitid in src/sys/unix.rs), so that stays on
      # every platform, Windows included.
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Windows client: named pipes, the console, the pseudoconsole, and the
  # relay transport over Windows' own ssh. Sessions themselves run on a Unix
  # host, which a runner has not, so the end-to-end relay tests
  # (tests/relay_windows.rs) skip here for want of `$NVMUX_TEST_SSH_HOST`, and
  # no Neovim is needed: nothing on this side starts one without a session.
  windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  msrv:
    name: rust-version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo check --all-targets
      - run: cargo check --all-targets --target x86_64-pc-windows-msvc
