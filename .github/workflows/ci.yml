name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The integration tests skip when there is no usable nvim. In CI that would
  # be a silent no-op, so a missing nvim is a failure here. `ssh` is not
  # listed: the SSH tests need a host that answers, which a runner has not.
  NVMUX_TEST_REQUIRE: nvim
  # The integration tests spend their time waiting — on Neovim, on links made
  # slow on purpose, on frames — not computing: tests/client.rs adds up to
  # the same 1,520 test-seconds run 4, 8 or 16 at a time, and is done in 394,
  # 202 or 111. One per core, the default, is 4 on a Linux runner and 3 on a
  # macOS one.
  RUST_TEST_THREADS: 16

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The dependencies, built optimised in a debug build (see Cargo.toml),
      # once for every change of toolchain or Cargo.lock rather than every
      # run. Saved from main alone, which every branch can restore from, so
      # that branches do not crowd main's out of the repository's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Neovim (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o nvim.tar.gz \
            https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf nvim.tar.gz
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim
      - run: nvim --version | head -1
      # The remote command is parsed by the user's login shell first, and the
      # test that runs it under each shell skips any it cannot find. fish and
      # tcsh are the ones that do not speak POSIX sh, and zsh is macOS's
      # default; macOS ships the last two, a Linux runner none of them.
      - name: Install login shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish tcsh zsh
      # rustfmt's output does not vary by platform; clippy's findings do
      # (see the cfg-divergent waitid in src/pty.rs), so that stays on both.
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      # Sixteen tests at once have between 256 and 384 files open at the most:
      # under a soft limit of 256, a stock macOS shell's, tests/client.rs fails
      # with EMFILE. Raised where it is lower, as it may be on macOS; a Linux
      # runner allows 65536.
      - name: cargo test
        run: |
          if [ "$(ulimit -n)" != unlimited ] && [ "$(ulimit -n)" -lt 4096 ]; then
            ulimit -n 4096
          fi
          ulimit -n
          cargo test

  msrv:
    name: rust-version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets
