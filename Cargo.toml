[package]
name = "nvmux"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A tmux-style session manager for Neovim"
license = "MIT"
repository = "https://github.com/Shooooooooo/nvmux"
readme = "README.md"
keywords = ["neovim", "nvim", "session", "tmux", "ssh"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = [
    "std", "help", "usage", "error-context", "suggestions", "derive",
] }
getrandom = "0.4"
# Ranks the create prompt's directory completions. Its own two dependencies,
# `memchr` and `unicode-segmentation`, were already in this tree, so it adds
# exactly one crate to the build graph -- which is what made it worth taking
# rather than hand-rolling a subsequence scorer.
nucleo-matcher = "0.3"
# Only the crossterm backend: the defaults also pull in every widget (the
# calendar brings the `time` crate) and the layout macros, none of which the
# picker uses.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `display` is the serialising half: the state file is written, not just read.
toml = { version = "1", default-features = false, features = [
    "std",
    "parse",
    "display",
    "serde",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
unicode-width = "0.2.2"
# The decoder `src/ledger.rs` reads a kept client's output with, for the few
# terminal settings it would not send again. Already in the tree as `vt100`'s
# own parser, at the same version, so it adds no crate to the build graph.
vte = "0.15"
# Keeps a shadow copy of an attached session's screen, so the outgoing session
# can be dissolved cell by cell (see `src/shadow.rs`). The bytes reaching the
# terminal are never touched; the parser only watches them go by. It brings
# `vte` and `arrayvec`; its other dependencies were already in the tree. The
# relay tests (tests/relay_encodings.rs) reuse it to ask what is *on* a row of
# the far side of a pty rather than what went past on the wire.
vt100 = "0.16"

# The attach path is a pty proxy, and a pty is a Unix idea: these three are
# how nvmux holds one open, reads it with `poll`, and signals the client on it.
# Windows has none of that to wrap -- see `src/sys/windows/`, which holds a
# ConPTY of its own rather than `portable-pty`'s, for the flags that one fixes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.31", default-features = false, features = [
    "fs", "process", "signal", "term", "user",
] }
portable-pty = "0.9"

# Already in Cargo.lock at this version (`errno`, `mio` and `rustix` name it
# for their own Windows builds), so it adds no crate to the lockfile: the
# features are the only thing new.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
strip = true
