[package]
name = "nvmux"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A tmux-style session manager for Neovim"
license = "MIT"
repository = "https://github.com/Shooooooooo/nvmux-rs"
readme = "README.md"
keywords = ["neovim", "nvim", "session", "tmux", "ssh"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = [
    "std", "help", "usage", "error-context", "suggestions", "derive",
] }
getrandom = "0.4"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = [
    "fs", "process", "signal", "term", "user",
] }
portable-pty = "0.9"
# Only the crossterm backend: the defaults also pull in every widget (the
# calendar brings the `time` crate) and the layout macros, none of which the
# picker uses.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `display` is the serialising half: the state file is written, not just read.
toml = { version = "1", default-features = false, features = [
    "std",
    "parse",
    "display",
    "serde",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
strip = true
