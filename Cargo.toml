[package]
name = "nvmux"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "A tmux-style session manager for Neovim"
license = "MIT"
repository = "https://github.com/Shooooooooo/nvmux"
readme = "README.md"
keywords = ["neovim", "nvim", "session", "tmux", "ssh"]
categories = ["command-line-utilities", "development-tools"]
# Not needed to build: the README links its images by URL.
exclude = ["assets/", "tools/", ".github/"]

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = [
    "std", "help", "usage", "error-context", "suggestions", "derive",
] }
getrandom = "0.4"
libc = "0.2"
# Fixed-string search in the relay and `src/ledger.rs`. Already in the tree;
# 2.4 adds `memmem`.
memchr = "2.4"
# Ranks directory completions; adds only itself to the build graph.
nucleo-matcher = "0.3"
nix = { version = "0.31", default-features = false, features = [
    "fs", "process", "signal", "term", "user",
] }
# The client's pty; the child is a plain `std::process::Child`.
pty-process = "0.5"
# Crossterm backend only: the default widgets pull in unused crates.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `display`: the state file is written, not just read.
toml = { version = "1", default-features = false, features = [
    "std",
    "parse",
    "display",
    "serde",
] }
# The settings screen edits config.toml in place, keeping its comments and
# layout, which `toml` cannot do.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# No `attributes`: nvmux uses no `#[instrument]`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# No `env-filter`: `$NVMUX_LOG` is a `filter::Targets`, and `EnvFilter`
# links a regex engine.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
unicode-width = "0.2.2"
# Used by `src/ledger.rs`; at `vt100`'s version, so it adds no crate.
vte = "0.15"
# Shadow copy of the attached screen for the dissolve (see `src/shadow.rs`).
vt100 = "0.16"

[profile.release]
lto = "thin"
strip = true

# Optimise dependencies in debug builds: unoptimised, the integration tests
# miss their frame-length deadlines on a busy machine.
[profile.dev.package."*"]
opt-level = 2

# Release with line tables, for profilers: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
